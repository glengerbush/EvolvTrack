<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EvolvTrack" />
    <script>
      // Resolve light/dark before first paint so a refresh into dark mode
      // doesn't flash a frame of the light theme. Mirrors the resolution in
      // src/lib/stores/themeStore.ts (storage key + 'system' default).
      (function () {
        try {
          var stored = null;
          try { stored = localStorage.getItem('evolvtrack-color-mode'); } catch (_) {}
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var mode = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          document.documentElement.dataset.colorMode = mode;
          document.documentElement.style.colorScheme = mode;
        } catch (_) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
